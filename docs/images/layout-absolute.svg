<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" font-family="monospace, sans-serif">
  <rect width="620" height="300" fill="#f8f9fa" rx="8"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">AbsoluteLayout</text>

  <!-- ── Pixel (left) ── -->
  <text x="175" y="58" text-anchor="middle" font-size="13" fill="#555">Pixel (NONE)</text>

  <rect x="40" y="68" width="270" height="200" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- icon at (20,20) w=100 h=80 -->
  <rect x="68" y="96" width="100" height="80" rx="4" fill="#4C9BE8" opacity="0.9"/>
  <text x="118" y="141" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Icon</text>
  <!-- position annotation -->
  <line x1="40" y1="96" x2="68" y2="96" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="68" y1="68" x2="68" y2="96" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="52" y="93" font-size="10" fill="#888">y=20</text>
  <text x="46" y="112" font-size="10" fill="#888">x=20</text>

  <!-- badge at (160, 20) w=60 h=40 -->
  <rect x="198" y="96" width="90" height="60" rx="4" fill="#E8854C" opacity="0.9"/>
  <text x="243" y="131" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Badge</text>
  <text x="243" y="208" text-anchor="middle" font-size="11" fill="#888">x=160, y=20</text>
  <text x="243" y="222" text-anchor="middle" font-size="11" fill="#888">w=90, h=60</text>

  <!-- ── Proportional (right) ── -->
  <text x="445" y="58" text-anchor="middle" font-size="13" fill="#555">Proportional (ALL)</text>

  <rect x="310" y="68" width="270" height="200" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- item at (0.1, 0.1) w=0.5 h=0.5 -->
  <rect x="337" y="88" width="135" height="100" rx="4" fill="#9B7FE8" opacity="0.9"/>
  <text x="404" y="143" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Item A</text>
  <text x="404" y="208" text-anchor="middle" font-size="11" fill="#888">x=0.1, y=0.1</text>
  <text x="404" y="222" text-anchor="middle" font-size="11" fill="#888">w=0.5, h=0.5</text>

  <!-- small overlay at (0.7, 0.6) w=0.25 h=0.3 -->
  <rect x="527" y="188" width="42" height="60" rx="4" fill="#56C271" opacity="0.9"/>
  <text x="548" y="222" text-anchor="middle" font-size="10" fill="white" font-weight="bold">B</text>

  <!-- proportion labels on right side -->
  <text x="590" y="90"  font-size="10" fill="#aaa">0%</text>
  <text x="590" y="168" font-size="10" fill="#aaa">50%</text>
  <text x="590" y="268" font-size="10" fill="#aaa">100%</text>
  <line x1="582" y1="68"  x2="582" y2="268" stroke="#ddd" stroke-width="1"/>
  <line x1="578" y1="68"  x2="586" y2="68"  stroke="#ddd" stroke-width="1"/>
  <line x1="578" y1="168" x2="586" y2="168" stroke="#ddd" stroke-width="1"/>
  <line x1="578" y1="268" x2="586" y2="268" stroke="#ddd" stroke-width="1"/>
</svg>
