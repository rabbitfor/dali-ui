<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" font-family="monospace, sans-serif">
  <rect width="640" height="340" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">StackLayout</text>

  <!-- ===== VERTICAL ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="13" fill="#555">Vertical</text>

  <!-- Container -->
  <rect x="60" y="68" width="160" height="230" rx="4" fill="#fff" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Child A -->
  <rect x="72" y="80" width="136" height="52" rx="4" fill="#4C9BE8" stroke="#2a78c5" stroke-width="1"/>
  <text x="140" y="111" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child A</text>

  <!-- spacing arrow A-B -->
  <line x1="140" y1="134" x2="140" y2="146" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>
  <text x="155" y="143" font-size="11" fill="#888">spacing</text>

  <!-- Child B -->
  <rect x="72" y="148" width="136" height="64" rx="4" fill="#56C271" stroke="#3aA055" stroke-width="1"/>
  <text x="140" y="185" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child B</text>

  <!-- spacing arrow B-C -->
  <line x1="140" y1="214" x2="140" y2="226" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Child C -->
  <rect x="72" y="228" width="136" height="58" rx="4" fill="#E8854C" stroke="#c5632a" stroke-width="1"/>
  <text x="140" y="262" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child C</text>

  <!-- ===== HORIZONTAL ===== -->
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#555">Horizontal</text>

  <!-- Container -->
  <rect x="280" y="68" width="330" height="90" rx="4" fill="#fff" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Child A -->
  <rect x="292" y="80" width="76" height="66" rx="4" fill="#4C9BE8" stroke="#2a78c5" stroke-width="1"/>
  <text x="330" y="118" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child A</text>

  <!-- spacing -->
  <line x1="370" y1="113" x2="382" y2="113" stroke="#aaa" stroke-width="1"/>
  <text x="371" y="108" font-size="10" fill="#888">sp</text>

  <!-- Child B -->
  <rect x="384" y="80" width="100" height="66" rx="4" fill="#56C271" stroke="#3aA055" stroke-width="1"/>
  <text x="434" y="118" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child B</text>

  <!-- spacing -->
  <line x1="486" y1="113" x2="498" y2="113" stroke="#aaa" stroke-width="1"/>

  <!-- Child C -->
  <rect x="500" y="80" width="98" height="66" rx="4" fill="#E8854C" stroke="#c5632a" stroke-width="1"/>
  <text x="549" y="118" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Child C</text>

  <!-- weight label -->
  <text x="460" y="186" text-anchor="middle" font-size="12" fill="#555">Weight 1 : Weight 2 : Weight 1</text>
  <rect x="292" y="196" width="72" height="28" rx="3" fill="#4C9BE8" opacity="0.7"/>
  <rect x="368" y="196" width="145" height="28" rx="3" fill="#56C271" opacity="0.7"/>
  <rect x="517" y="196" width="81" height="28" rx="3" fill="#E8854C" opacity="0.7"/>
  <text x="328" y="215" text-anchor="middle" font-size="11" fill="white">w=1</text>
  <text x="440" y="215" text-anchor="middle" font-size="11" fill="white">w=2</text>
  <text x="558" y="215" text-anchor="middle" font-size="11" fill="white">w=1</text>

  <!-- StackLayoutParams legend -->
  <rect x="280" y="238" width="330" height="82" rx="4" fill="#f0f4ff" stroke="#ccd" stroke-width="1"/>
  <text x="295" y="256" font-size="12" fill="#444" font-weight="bold">StackLayoutParams</text>
  <text x="295" y="274" font-size="11" fill="#555">• SetWeight(float)  — main-axis space distribution</text>
  <text x="295" y="291" font-size="11" fill="#555">• SetAlignment(LayoutAlignment)  — cross-axis align</text>
  <text x="295" y="308" font-size="11" fill="#666">  FILL / START / CENTER / END</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaa"/>
    </marker>
  </defs>
</svg>
