<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" font-family="monospace, sans-serif">
  <rect width="520" height="360" fill="#f8f9fa" rx="8"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Margin &amp; Padding</text>

  <!-- Parent container -->
  <rect x="40" y="50" width="440" height="280" rx="6" fill="#e8eef8" stroke="#7a9ccf" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="11" fill="#7a9ccf">Parent Layout</text>

  <!-- Margin area (between parent and view border) - visualized as gap -->
  <!-- margin top=24, right=40, bottom=24, left=40 -->

  <!-- View border (margin edge) -->
  <rect x="80" y="90" width="360" height="220" rx="4" fill="none" stroke="#E8854C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="100" y="106" font-size="11" fill="#E8854C">← margin →</text>

  <!-- Margin arrows -->
  <!-- left margin -->
  <line x1="40"  y1="200" x2="80"  y2="200" stroke="#E8854C" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="60"  y="194" text-anchor="middle" font-size="10" fill="#E8854C">margin</text>
  <text x="60"  y="206" text-anchor="middle" font-size="10" fill="#E8854C">left</text>

  <!-- right margin -->
  <line x1="440" y1="200" x2="480" y2="200" stroke="#E8854C" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="460" y="194" text-anchor="middle" font-size="10" fill="#E8854C">margin</text>
  <text x="460" y="206" text-anchor="middle" font-size="10" fill="#E8854C">right</text>

  <!-- top margin -->
  <line x1="260" y1="50"  x2="260" y2="90"  stroke="#E8854C" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="280" y="75"  font-size="10" fill="#E8854C">margin top</text>

  <!-- bottom margin -->
  <line x1="260" y1="310" x2="260" y2="330" stroke="#E8854C" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="276" y="324" font-size="10" fill="#E8854C">margin bottom</text>

  <!-- View background (padding area) -->
  <rect x="80" y="90" width="360" height="220" rx="4" fill="#c8ddf8" stroke="#4C9BE8" stroke-width="2"/>

  <!-- Padding area label -->
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#4C9BE8">padding area</text>

  <!-- Padding arrows -->
  <!-- left padding -->
  <line x1="80"  y1="200" x2="124" y2="200" stroke="#4C9BE8" stroke-width="1.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="102" y="194" text-anchor="middle" font-size="10" fill="#4C9BE8">padding</text>
  <text x="102" y="206" text-anchor="middle" font-size="10" fill="#4C9BE8">left</text>

  <!-- right padding -->
  <line x1="396" y1="200" x2="440" y2="200" stroke="#4C9BE8" stroke-width="1.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="418" y="194" text-anchor="middle" font-size="10" fill="#4C9BE8">padding</text>
  <text x="418" y="206" text-anchor="middle" font-size="10" fill="#4C9BE8">right</text>

  <!-- top padding -->
  <line x1="180" y1="90"  x2="180" y2="130" stroke="#4C9BE8" stroke-width="1.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="126" y="115" font-size="10" fill="#4C9BE8">padding top</text>

  <!-- bottom padding -->
  <line x1="180" y1="270" x2="180" y2="310" stroke="#4C9BE8" stroke-width="1.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="120" y="296" font-size="10" fill="#4C9BE8">padding bottom</text>

  <!-- Content area -->
  <rect x="124" y="130" width="272" height="140" rx="4" fill="#4C9BE8" opacity="0.85"/>
  <text x="260" y="195" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Content</text>
  <text x="260" y="213" text-anchor="middle" font-size="11" fill="white">(children / background)</text>

  <!-- Extents order note -->
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#777">Extents(top, right, bottom, left)</text>

  <defs>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="#E8854C"/>
    </marker>
    <marker id="arr3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="#4C9BE8"/>
    </marker>
  </defs>
</svg>
