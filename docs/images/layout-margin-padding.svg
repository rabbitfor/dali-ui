<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" font-family="sans-serif" font-size="12">
  <rect width="600" height="400" fill="#f8f9fa" rx="8"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Margin &amp; Padding</text>

  <!-- Parent container -->
  <rect x="50" y="50" width="500" height="290" rx="6" fill="#e4eaf4" stroke="#8aaad4" stroke-width="1.5"/>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#8aaad4">Parent Layout</text>

  <!-- View (background covers entire view area including padding) -->
  <rect x="120" y="115" width="360" height="160" rx="4" fill="#7aabdf" stroke="#4C9BE8" stroke-width="2"/>

  <!-- Content area (inside padding) -->
  <rect x="175" y="155" width="250" height="80" rx="4" fill="#ffffff" opacity="0.88" stroke="#cde" stroke-width="1"/>
  <text x="300" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Content</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#666">(children)</text>

  <!-- ── Margin labels ── -->
  <!-- top -->
  <text x="300" y="87" text-anchor="middle" font-size="11" fill="#c06020">margin  (top)</text>
  <!-- bottom -->
  <text x="300" y="312" text-anchor="middle" font-size="11" fill="#c06020">margin  (bottom)</text>
  <!-- left -->
  <text x="85" y="199" text-anchor="middle" font-size="11" fill="#c06020" transform="rotate(-90,85,199)">margin (start)</text>
  <!-- right -->
  <text x="515" y="199" text-anchor="middle" font-size="11" fill="#c06020" transform="rotate(90,515,199)">margin (end)</text>

  <!-- ── Padding labels ── (inside view, outside content) -->
  <!-- top -->
  <text x="300" y="139" text-anchor="middle" font-size="11" fill="#1458a0">padding  (top)</text>
  <!-- bottom -->
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#1458a0">padding  (bottom)</text>
  <!-- left -->
  <text x="148" y="199" text-anchor="middle" font-size="11" fill="#1458a0" transform="rotate(-90,148,199)">padding (start)</text>
  <!-- right -->
  <text x="452" y="199" text-anchor="middle" font-size="11" fill="#1458a0" transform="rotate(90,452,199)">padding (end)</text>

  <!-- ── Legend ── -->
  <rect x="50" y="355" width="500" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="66"  y="368" width="14" height="14" rx="2" fill="#7aabdf" stroke="#4C9BE8" stroke-width="1.5"/>
  <text x="86" y="380" font-size="11" fill="#333">View background (covers view area including padding)</text>
  <rect x="338" y="368" width="14" height="14" rx="2" fill="#e4eaf4" stroke="#8aaad4" stroke-width="1.5"/>
  <text x="358" y="380" font-size="11" fill="#333">Margin (outside view)</text>
</svg>
