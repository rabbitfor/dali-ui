<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" font-family="monospace, sans-serif">
  <rect width="620" height="380" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="310" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">GridLayout</text>

  <!-- Column headers -->
  <text x="200" y="58" text-anchor="middle" font-size="12" fill="#555">Star(1)</text>
  <text x="390" y="58" text-anchor="middle" font-size="12" fill="#555">Star(2)</text>

  <!-- Row labels -->
  <text x="68" y="100" text-anchor="end" font-size="11" fill="#777">Auto</text>
  <text x="68" y="175" text-anchor="end" font-size="11" fill="#777">Star</text>
  <text x="68" y="270" text-anchor="end" font-size="11" fill="#777">100dp</text>

  <!-- Container outline -->
  <rect x="80" y="65" width="480" height="260" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <!-- Row 0: Auto — header spans full width -->
  <rect x="80" y="65" width="480" height="50" rx="0" fill="#4C9BE8" opacity="0.85"/>
  <text x="320" y="96" text-anchor="middle" font-size="13" fill="white" font-weight="bold">header  (columnSpan=2)</text>

  <!-- Row 1: Star -->
  <!-- col 0: sidebar -->
  <rect x="80" y="119" width="152" height="136" fill="#56C271" opacity="0.85"/>
  <text x="156" y="192" text-anchor="middle" font-size="13" fill="white" font-weight="bold">sidebar</text>

  <!-- col 1: main -->
  <rect x="236" y="119" width="324" height="136" fill="#9B7FE8" opacity="0.85"/>
  <text x="398" y="192" text-anchor="middle" font-size="13" fill="white" font-weight="bold">main</text>

  <!-- col spacing line -->
  <line x1="232" y1="115" x2="232" y2="325" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Row 2: 100dp footer -->
  <rect x="80" y="259" width="480" height="66" rx="0" fill="#E8854C" opacity="0.85"/>
  <text x="320" y="298" text-anchor="middle" font-size="13" fill="white" font-weight="bold">footer  (columnSpan=2)</text>

  <!-- row dividers -->
  <line x1="80" y1="115" x2="560" y2="115" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="255" x2="560" y2="255" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- column width brace -->
  <line x1="80" y1="336" x2="232" y2="336" stroke="#888" stroke-width="1"/>
  <line x1="232" y1="336" x2="560" y2="336" stroke="#888" stroke-width="1"/>
  <line x1="80" y1="330" x2="80" y2="342" stroke="#888" stroke-width="1"/>
  <line x1="232" y1="330" x2="232" y2="342" stroke="#888" stroke-width="1"/>
  <line x1="560" y1="330" x2="560" y2="342" stroke="#888" stroke-width="1"/>
  <text x="156" y="355" text-anchor="middle" font-size="11" fill="#666">1★</text>
  <text x="396" y="355" text-anchor="middle" font-size="11" fill="#666">2★  (twice as wide)</text>

  <!-- GridLayoutParams legend -->
  <rect x="80" y="368" width="480" height="0" rx="4" fill="#f0f4ff"/>

  <!-- legend box -->
  <rect x="80" y="336" width="480" height="38" rx="4" fill="none"/>
</svg>
